name: claude-review

on:
  pull_request:
    types: [opened, ready_for_review]
    paths-ignore:
      - '.github/workflows/claude-review.yaml'
  issue_comment:
    types: [created]

jobs:
  review:
    runs-on: ubuntu-latest

    if: |
      (
        github.event_name == 'pull_request'
        && !github.event.pull_request.draft
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]'
      )
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(github.event.comment.body, '/claude-review')
        && github.event.comment.user.type != 'Bot'
      )

    permissions:
      contents: read
      pull-requests: read
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: veecle/style-guide/.github/actions/claude-review@main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: veecle-renovate-bot

  minimize-old-claude-comments:
    runs-on: ubuntu-latest
    needs: review
    if: always() && needs.review.result == 'success'

    permissions:
      pull-requests: write

    steps:
      - uses: veecle/style-guide/.github/actions/minimize-old-claude-comments@main
