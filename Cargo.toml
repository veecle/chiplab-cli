[workspace]
resolver = "3"
members = ["chiplab-api", "chiplab-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Command-line client for Chiplab"
homepage = "https://chiplab.veecle.ai"
repository = "https://github.com/veecle/chiplab-cli"
license = "MIT"
publish = false

[workspace.dependencies]
anstyle-svg = { version = "1.1.1", default-features = false }
camino = { version = "1.2.1", default-features = false }
cap-std = { version = "4.0.3", default-features = false, features = ["fs_utf8"] }
chiplab-api = { path = "chiplab-api" }
clap = { version = "4.6.7", default-features = false, features = [
  "default",
  "derive"
] }
console = { version = "0.16.6", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", default-features = false, features = [
  "alloc"
] }
indicatif = { version = "0.18.6", default-features = false, features = [
  "unicode-width"
] }
regex = { version = "1.13.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "query",
  "rustls",
  "stream"
] }
serde = { version = "1.0.229", default-features = false, features = [
  "derive",
  "std"
] }
serde_ignored = { version = "0.1.14", default-features = false }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
serde_repr = { version = "0.1.21", default-features = false }
snapbox = { version = "1.2.2", default-features = false }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
tempfile = { version = "3.27.0", default-features = false }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
tiny_http = { version = "0.12.0", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = [
  "fs",
  "io-util",
  "macros",
  "rt"
] }
tokio-util = { version = "0.7.19", default-features = false, features = ["io"] }
tryfn = { version = "1.1.0", default-features = false }
url = { version = "2.5.8", default-features = false, features = ["std"] }
vt100 = { version = "0.18.1", default-features = false }
