[workspace]
resolver = "3"
members = ["chiplab-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Command-line client for Chiplab"
homepage = "https://chiplab.veecle.ai"
repository = "https://github.com/veecle/chiplab-cli"
publish = false

[workspace.dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
clap = { version = "4.6.7", default-features = false, features = [
  "default",
  "derive"
] }
snapbox = { version = "1.2.2", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = [
  "macros",
  "rt"
] }
tryfn = { version = "1.1.0", default-features = false }
